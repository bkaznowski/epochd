kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Single control-plane node is sufficient for the integration test suite.
# The agent DaemonSet is not privileged: it holds only CAP_SYS_PTRACE, which is
# enough for ptrace-attach and process_vm_writev across PID namespaces.
# hostPID: true on the agent pod gives it access to the kind node's /proc, so
# no extra extraMounts are required.
nodes:
  - role: control-plane
    # Harmless for the agent, which no longer needs it; kept so a privileged fallback works.
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            allow-privileged: "true"
