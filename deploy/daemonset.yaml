apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: epochd-agent
  namespace: epochd
  labels:
    app: epochd-agent
spec:
  selector:
    matchLabels:
      app: epochd-agent
  template:
    metadata:
      labels:
        app: epochd-agent
    spec:
      # Share the host PID namespace so the agent can see all container PIDs
      # via /proc and attach to them with ptrace.
      hostPID: true
      # Bind to the node's network so the controller can reach the agent
      # at nodeIP:9433 (hostIP from pod.Status.HostIP). The port is not 9100:
      # that is node-exporter's default, and with hostNetwork the two would
      # fight over it on any cluster that runs it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Give the agent 15 s to finish draining handles before the kubelet
      # force-kills the pod. The drain itself takes <1 ms (one process_vm_writev
      # per handle), so 15 s is generous headroom for slow k8s signal delivery.
      terminationGracePeriodSeconds: 15

      tolerations:
        - operator: Exists  # run on every node including control-plane

      containers:
        - name: agent
          # Pin a version tag in production (for example :v0.8.0). With :latest and
          # IfNotPresent a node that already has an image never pulls an update.
          image: ghcr.io/bkaznowski/epochd-agent:latest
          imagePullPolicy: IfNotPresent
          # The agent is privileged and can change the clock of any process on the
          # node, so it refuses to start without credentials. The token comes from
          # the epochd-auth Secret (see deploy/README.md); add --tls-cert-file and
          # --tls-key-file (and --tls-client-ca-file for mutual TLS) so the token is
          # not sent in the clear.
          args:
            - "--listen=:9433"
            - "--auth-token-file=/etc/epochd/auth/token"
          ports:
            - name: grpc
              containerPort: 9433
              hostPort: 9433
              protocol: TCP
          volumeMounts:
            - name: auth
              mountPath: /etc/epochd/auth
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9433
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9433
            initialDelaySeconds: 5
            periodSeconds: 10
          # Not privileged. CAP_SYS_PTRACE is all ptrace-attach and process_vm_writev
          # across containers need (with hostPID above); the end-to-end suite passes
          # with exactly this. It is still close to root on the node: see "What the
          # agent can do" in deploy/README.md, including the AppArmor and SELinux
          # settings some clusters need.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_PTRACE"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        # Only the agent's own token: the API token the controller accepts from
        # clients is deliberately not mounted here.
        - name: auth
          secret:
            secretName: epochd-auth
            items:
              - key: agent-token
                path: token
