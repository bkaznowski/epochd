apiVersion: v1
kind: Namespace
metadata:
  name: epochd

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epochd-controller
  namespace: epochd

---
# The controller reads pods to resolve label selectors and discover which node
# each container lives on, and posts Events on them (timeshift expiry, and a
# warning when a container could not be put back on the real clock). Without the
# events rule the Events are silently dropped by the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: epochd-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
# ConfigMap access is namespace-scoped so a Role (not ClusterRole) is used.
# The controller needs get/create/update to maintain the epochd-state ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epochd-controller
  namespace: epochd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epochd-controller
  namespace: epochd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epochd-controller
subjects:
  - kind: ServiceAccount
    name: epochd-controller
    namespace: epochd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: epochd-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: epochd-controller
subjects:
  - kind: ServiceAccount
    name: epochd-controller
    namespace: epochd
