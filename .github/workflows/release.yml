name: Release

# Releases two Go modules from one commit of main:
#
#   vX.Y.Z               the root module, at the commit being released
#   pkg/faketime/vX.Y.Z  the nested module, at a follow-up commit that pins its
#                        requirement on the root module to vX.Y.Z
#
# Both tags and the follow-up commit are published in ONE atomic push, so a failure
# leaves nothing half-released. Only the GitHub release pages are created
# afterwards; if that step fails, re-running the workflow with the same version
# notices the tags exist and just finishes the pages.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.8.0)"
        required: true
      dry_run:
        description: "Do everything except publish: run every check, build the pkg/faketime bump and both tags locally, ask the remote whether the push would be accepted, and stop"
        type: boolean
        default: false

permissions:
  contents: read

# Never two releases at once, and never cancel one half-way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The input is reached only through the environment. Interpolating
  # ${{ inputs.version }} into a script would let a crafted value run as shell.
  VERSION: ${{ inputs.version }}

jobs:
  release:
    name: Release
    # A release is cut from main, not from whatever branch the dispatch picked.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the tags and the follow-up commit, create releases
      actions: read   # read the CI results for this commit
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Both tags present: an earlier run published them and stopped before the
      # release pages. One present: someone made a tag by hand; do not guess.
      - name: Check what already exists
        id: state
        run: |
          have=0
          for t in "$VERSION" "pkg/faketime/$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then have=$((have + 1)); fi
          done
          case "$have" in
            0) echo "resume=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "resume=true" >> "$GITHUB_OUTPUT"
               echo "::notice::both tags for $VERSION already exist; only the release pages will be created" ;;
            *) echo "::error::exactly one of the tags for $VERSION exists; resolve it by hand before releasing"
               exit 1 ;;
          esac

      - name: Must release the tip of main
        if: steps.state.outputs.resume != 'true'
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved on ($tip); this run is for $GITHUB_SHA. Dispatch it again."
            exit 1
          fi

      # The workflow is run by hand, so nothing else guarantees the commit was
      # ever tested. Require the push-triggered runs of CI and E2E to have passed.
      - name: CI and E2E must have passed on this commit
        if: steps.state.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in ci.yml e2e.yml; do
            state=$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --event push --limit 1 \
                      --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            if [ "$state" != "completed/success" ]; then
              echo "::error::$wf on $GITHUB_SHA is '${state:-not found}', not completed/success. Wait for it, or fix it."
              exit 1
            fi
          done

      - name: Configure git
        if: steps.state.outputs.resume != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The nested module has `replace ... => ../..`, which only matters here:
      # consumers ignore it and resolve the root module by the version required.
      - name: Pin pkg/faketime to this version
        if: steps.state.outputs.resume != 'true'
        run: |
          git tag -a "$VERSION" -m "epochd $VERSION"
          (
            cd pkg/faketime
            export GOWORK=off
            go mod edit -require="github.com/bkaznowski/epochd@$VERSION"
            go mod tidy
            # What is about to be tagged must at least build.
            go build ./...
          )
          git add pkg/faketime/go.mod pkg/faketime/go.sum
          git commit -m "chore: bump pkg/faketime dependency to $VERSION"
          git tag -a "pkg/faketime/$VERSION" -m "pkg/faketime $VERSION"

      # `git push --dry-run` talks to the remote and reports what it would accept
      # (credentials, branch rules, a main that moved) without changing anything.
      - name: Dry run - what would be published
        if: steps.state.outputs.resume != 'true' && inputs.dry_run
        run: |
          echo "## Dry run for $VERSION" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            git log --oneline -3
            git tag -n1 --list "$VERSION" "pkg/faketime/$VERSION"
            git diff --stat HEAD~1 HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git push --dry-run --atomic origin \
            "HEAD:refs/heads/main" \
            "refs/tags/$VERSION" \
            "refs/tags/pkg/faketime/$VERSION"
          echo "Nothing was pushed (dry run)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish tags and commit
        if: steps.state.outputs.resume != 'true' && !inputs.dry_run
        run: |
          git push --atomic origin \
            "HEAD:refs/heads/main" \
            "refs/tags/$VERSION" \
            "refs/tags/pkg/faketime/$VERSION"

      # Safe to repeat: a page that exists is left alone.
      - name: Create GitHub releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --verify-tag \
              --title "epochd $VERSION" --generate-notes
          gh release view "pkg/faketime/$VERSION" >/dev/null 2>&1 || \
            gh release create "pkg/faketime/$VERSION" --verify-tag \
              --title "pkg/faketime $VERSION" --generate-notes
