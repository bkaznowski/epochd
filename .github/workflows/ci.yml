name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to a commit, not a tag a maintainer can move.
# Dependabot (.github/dependabot.yml) bumps the SHA and the version comment together.
permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Runs on main are never
# cancelled: one may be in the middle of publishing images or pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # -race: the controller, the tracker and the agent are concurrent, and the data
      # races found in them (see git history) only show up with the detector on.
      - name: Test (root module)
        run: go test ./... -race -count=1 -timeout=10m -coverprofile=coverage-root.out -covermode=atomic

      - name: Test (pkg/faketime module)
        working-directory: pkg/faketime
        run: go test ./... -race -count=1 -timeout=10m -coverprofile=coverage-faketime.out -covermode=atomic

      - name: Coverage summary
        run: |
          # ---------------------------------------------------------------------------
          # Coverage exclusions — add one entry per generated/vendored package.
          # Each entry is a path substring matched against the coverage profile lines.
          # ---------------------------------------------------------------------------
          exclude_patterns=(
            '/agentpb/'        # protoc-generated gRPC stubs (agent.pb.go, agent_grpc.pb.go)
            '/test/targets/'   # integration-test helper binaries — no unit tests by design
          )
          # Build grep -e flags from the list and filter the raw profile.
          grep_args=()
          for pat in "${exclude_patterns[@]}"; do grep_args+=(-e "$pat"); done
          grep -v "${grep_args[@]}" coverage-root.out > coverage-root-filtered.out
          {
            echo "## Test coverage"
            echo ""
            echo "### Root module (generated proto files excluded)"
            echo '```'
            go tool cover -func=coverage-root-filtered.out
            echo '```'
            echo ""
            echo "### pkg/faketime"
            echo '```'
            (cd pkg/faketime && go tool cover -func=coverage-faketime.out)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage-root-filtered.out
            pkg/faketime/coverage-faketime.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          # Pinned: "latest" lets a new release add checks that fail unrelated
          # changes. golangci-lint-action v6 drives the v1 series.
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

  coverage-pages:
    name: Coverage pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage

      - name: Build pages
        run: |
          mkdir -p pages/coverage

          # Preserve the existing docs site at the root.
          cp -r docs/. pages/

          # Per-module HTML coverage reports (proto-generated files excluded from root).
          go tool cover -html=coverage-root-filtered.out -o pages/coverage/root.html
          # pkg/faketime is a separate module; go tool cover must run inside it.
          (cd pkg/faketime && go tool cover -html=coverage-faketime.out -o ../../pages/coverage/faketime.html)

          # Extract total coverage percentage for the badge (proto files excluded).
          pct=$(go tool cover -func=coverage-root-filtered.out | awk '/^total:/{gsub(/%/,""); print $3}')
          pct_int="${pct%.*}"
          if [ "${pct_int}" -ge 80 ]; then color="#44cc11"
          elif [ "${pct_int}" -ge 60 ]; then color="#dfb317"
          else color="#e05d44"
          fi

          # Write SVG badge (flat style, no external font service needed).
          cat > pages/coverage/badge.svg << SVGEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" role="img" aria-label="coverage: ${pct}%">
            <title>coverage: ${pct}%</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="128" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="68" height="20" fill="#555"/>
              <rect x="68" width="60" height="20" fill="${color}"/>
              <rect width="128" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="34" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="34" y="14">coverage</text>
              <text x="98" y="15" fill="#010101" fill-opacity=".3">${pct}%</text>
              <text x="98" y="14">${pct}%</text>
            </g>
          </svg>
          SVGEOF

          # Index page for the /coverage/ sub-path.
          cat > pages/coverage/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>epochd — test coverage</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
              a { color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>Test coverage</h1>
            <ul>
              <li><a href="root.html">Root module (github.com/bkaznowski/epochd)</a></li>
              <li><a href="faketime.html">pkg/faketime (github.com/bkaznowski/epochd/pkg/faketime)</a></li>
            </ul>
            <p><a href="../">← Back to docs</a></p>
          </body>
          </html>
          HTMLEOF

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  build-images:
    name: Build images
    # The images are published as :latest from main, and the deployment manifests
    # run :latest, so only a build whose tests and lint passed may reach them.
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/epochd-agent:latest,ghcr.io/${{ github.repository_owner }}/epochd-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build controller image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/epochd-controller:latest,ghcr.io/${{ github.repository_owner }}/epochd-controller:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
