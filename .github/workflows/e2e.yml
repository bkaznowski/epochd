name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "pkg/**"
      - "deploy/**"
      - "e2e/**"
      - "Makefile"
      - "Dockerfile.*"

# Third-party actions are pinned to a commit, not a tag a maintainer can move.
# Dependabot (or a manual bump) updates the SHA and the version comment together.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # kind is downloaded as a bare binary, so it is checked against a hash recorded
  # here rather than one fetched from the same place as the binary.
  KIND_VERSION: v0.23.0
  KIND_SHA256: 1d86e3069ffbe3da9f1a918618aecbc778e00c75f838882d0dfa2d363bc4a68c

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -sSLfo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check --strict
          sudo install -m 0755 kind /usr/local/bin/kind
          rm kind

      # kubectl is pre-installed on ubuntu-latest runners.

      # The agent uses ptrace. ptrace_scope=1 is sufficient when the agent pod
      # has CAP_SYS_PTRACE (it runs as privileged), but set to 0 explicitly to
      # avoid any subtle restriction inside the kind node's PID namespace.
      - name: Allow ptrace
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope

      - name: Run integration tests
        run: make test-integration

      # Always clean up the kind cluster, even if tests failed.
      - name: Tear down cluster
        if: always()
        run: make kind-down-test || true
